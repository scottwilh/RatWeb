<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RatWeb</title>
    
    <!-- Firebase SDKs (versión compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #fcebe6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #fcebe6;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .auth-card {
            background-color: #fff;
            border: 3px solid #000;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 4px 4px 0px #000;
        }

        .auth-title {
            font-size: 22px;
            font-weight: bold;
            color: #8c4a4a;
            font-family: 'Georgia', serif;
            font-style: italic;
            text-align: center;
        }

        .avatar-preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .avatar-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
            background-color: #ffd8df;
        }

        .auth-card input, .auth-card textarea {
            width: 100%;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            outline: none;
            font-family: inherit;
        }

        .auth-card textarea {
            height: 50px;
            resize: none;
        }

        .btn-auth {
            background-color: #b56565;
            color: #fff;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        header {
            background-color: #fbeee8;
            border-bottom: 4px solid #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            height: 55px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #8c4a4a;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        .search-bar {
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 16px;
            padding: 2px 8px;
            width: 45%;
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 11px;
            background: transparent;
            font-family: inherit;
        }

        .user-header-profile {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar-top {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
            background-color: #fff;
            cursor: pointer;
        }

        .layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            height: calc(100dvh - 55px);
            min-height: 0;
        }

        nav {
            width: 75px;
            background-color: #dbe2e6;
            border-right: 3px solid #000;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .nav-btn {
            padding: 12px 4px;
            border-bottom: 2px solid #c0c8cc;
            font-weight: bold;
            font-size: 11px;
            color: #000;
            cursor: pointer;
            text-align: center;
            word-break: break-word;
        }

        .nav-btn.active {
            background-color: #cbd4d9;
        }

        main {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            width: calc(100% - 75px);
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .section {
            display: none;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .section.active {
            display: flex;
            min-height: 0;
        }

        .create-box {
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 14px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .create-box input, .create-box textarea, .create-box select {
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 6px;
            font-size: 11px;
            outline: none;
            font-family: inherit;
        }

        .create-box textarea {
            height: 45px;
            resize: none;
        }

        .btn-publish {
            background-color: #b56565;
            color: #fff;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-publish:disabled {
            background-color: #ccc;
            color: #777;
            border-color: #999;
            cursor: not-allowed;
        }

        .forum-limit-counter {
            font-size: 10px;
            font-weight: bold;
            color: #4a7c59;
        }

        .forum-limit-counter.limit-reached {
            color: #b56565;
        }

        .post-card {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            position: relative;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #000;
            object-fit: cover;
            background-color: #fff;
            flex-shrink: 0;
        }

        .post-bubble {
            background-color: #ffd8df;
            border: 2px solid #000;
            border-radius: 14px;
            padding: 8px;
            flex: 1;
            position: relative;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .post-author {
            font-size: 11px;
            color: #555;
            font-weight: bold;
        }

        .post-options-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .options-menu {
            display: none;
            position: absolute;
            right: 8px;
            top: 25px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 6px;
            z-index: 10;
        }

        .options-menu button {
            display: block;
            width: 100%;
            padding: 6px 10px;
            border: none;
            background: none;
            text-align: left;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        .post-content {
            font-size: 12px;
            color: #000;
            line-height: 1.2;
            word-break: break-word;
        }

        .post-media {
            margin-top: 6px;
            max-width: 100%;
            border: 2px solid #000;
            border-radius: 8px;
            display: block;
            cursor: pointer;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .action-btn {
            cursor: pointer;
            user-select: none;
        }

        .action-btn.liked {
            color: #b56565;
        }

        .replies-box {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #000;
            flex-direction: column;
            gap: 6px;
        }

        .replies-box.open {
            display: flex;
        }

        .reply-item {
            background-color: #fff;
            border: 1.5px solid #000;
            border-radius: 10px;
            padding: 6px 8px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .reply-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .reply-user-info {
            display: flex;
            flex-direction: column;
        }

        .reply-author {
            font-weight: bold;
            font-size: 11px;
            color: #000;
        }

        .reply-tag {
            font-size: 9.5px;
            color: #8c4a4a;
            font-weight: bold;
        }

        .reply-actions-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .reply-action-btn {
            font-size: 10px;
            color: #000;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }

        .delete-comment-btn {
            color: #b56565;
            text-decoration: none;
            cursor: pointer;
            font-size: 12px;
            background: none;
            border: none;
        }

        .comment-media {
            max-width: 100%;
            max-height: 140px;
            border: 1px solid #000;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
            cursor: pointer;
        }

        .reply-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
            background: #fdf5f6;
            border: 1.5px solid #000;
            border-radius: 10px;
            padding: 6px;
        }

        .reply-target-indicator {
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 9.5px;
            background: #ffd8df;
            border: 1px solid #000;
            border-radius: 6px;
            padding: 2px 6px;
            font-weight: bold;
        }

        .reply-target-indicator.active {
            display: flex;
        }

        .reply-input-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .reply-input-row input[type="text"] {
            flex: 1;
            border: 1px solid #000;
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 11px;
            outline: none;
            font-family: inherit;
        }

        .file-label {
            background-color: #ffd8df;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .forum-card {
            background-color: #e2f0d9;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        .forum-header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .forum-stats-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 10px;
            font-weight: bold;
            color: #2b5735;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #000;
            align-self: flex-start;
        }

        .btn-join-forum {
            background-color: #b56565;
            color: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-join-forum.joined {
            background-color: #dbe2e6;
            color: #000;
        }

        .btn-delete-forum {
            background-color: #e74c3c;
            color: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .forum-category {
            font-size: 10px;
            font-weight: bold;
            color: #4a7c59;
            text-transform: uppercase;
        }

        .forum-title {
            font-size: 14px;
            font-weight: bold;
            color: #000;
        }

        .forum-desc {
            font-size: 11px;
            color: #333;
        }

        .forum-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }

        .forum-tag-badge {
            font-size: 9px;
            font-weight: bold;
            background-color: #fff;
            color: #2b5735;
            border: 1px solid #000;
            border-radius: 6px;
            padding: 1px 5px;
        }

        .btn-back {
            background-color: #dbe2e6;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
            flex-shrink: 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .polaroid-card {
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .polaroid-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border: 1px solid #000;
            border-radius: 4px;
            cursor: pointer;
        }

        .polaroid-caption {
            font-size: 10px;
            font-weight: bold;
            margin-top: 4px;
            text-align: center;
            word-break: break-word;
        }

        .polaroid-tag {
            font-size: 8px;
            background: #ffd8df;
            border: 1px solid #000;
            border-radius: 4px;
            padding: 1px 4px;
            margin-top: 2px;
        }

        .polaroid-delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #e74c3c;
            color: #fff;
            border: 1.5px solid #000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 2;
        }

        .polaroid-like-btn {
            font-size: 10px;
            font-weight: bold;
            margin-top: 4px;
            cursor: pointer;
            user-select: none;
        }

        .polaroid-like-btn.liked {
            color: #b56565;
        }

        .visibility-selector {
            display: flex;
            gap: 10px;
            font-size: 11px;
            font-weight: bold;
            align-items: center;
        }

        .visibility-selector label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .profile-card {
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .profile-banner {
            height: 100px;
            background-color: #ffd8df;
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid #000;
            position: relative;
        }

        .profile-edit-banner-btn {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 3px 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .profile-avatar-row {
            display: flex;
            padding: 0 12px;
            margin-top: -34px;
        }

        .profile-avatar-wrap {
            position: relative;
            width: 70px;
            height: 70px;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #fff;
            outline: 2px solid #000;
            object-fit: cover;
            background-color: #fff;
        }

        .profile-edit-avatar-btn {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .profile-info {
            padding: 10px 12px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .profile-display-name {
            font-weight: bold;
            font-size: 14px;
            color: #000;
        }

        .profile-username {
            font-size: 11px;
            color: #8c4a4a;
            font-weight: bold;
        }

        .profile-edit-pencil {
            cursor: pointer;
            font-size: 11px;
        }

        .profile-edit-box {
            display: none;
            gap: 4px;
            align-items: center;
            margin-top: 2px;
        }

        .profile-edit-box input {
            flex: 1;
            border: 1.5px solid #000;
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 11px;
            outline: none;
            font-family: inherit;
        }

        .profile-cooldown-note {
            font-size: 9.5px;
            color: #999;
            font-style: italic;
            min-height: 12px;
        }

        .profile-bio-input {
            margin-top: 6px;
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 6px;
            font-size: 11px;
            font-family: inherit;
            height: 55px;
            resize: none;
            outline: none;
        }

        .profile-stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            background: #fdf5f6;
            border: 1.5px solid #000;
            border-radius: 10px;
            padding: 8px 4px;
        }

        .profile-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9.5px;
            font-weight: bold;
            gap: 2px;
            flex: 1;
        }

        .profile-stat-item strong {
            font-size: 14px;
            color: #8c4a4a;
        }

        .profile-joined-note {
            font-size: 10px;
            color: #777;
            margin-top: 8px;
            text-align: center;
            font-style: italic;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            border: 2px solid #000;
            border-radius: 14px;
            background: #fff;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .chat-toggle-bar {
            background: #e8dff5;
            border-bottom: 2px solid #000;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            gap: 6px;
            flex-shrink: 0;
        }

        .chat-toggle-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .chat-icon-btn {
            border: 1.5px solid #000;
            background: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            line-height: 1.3;
        }

        .chat-icon-btn.active-toggle {
            background: #ffd8df;
        }

        .chat-search-bar {
            display: none;
            padding: 6px;
            border-bottom: 2px solid #000;
            background: #fff;
            flex-shrink: 0;
        }

        .chat-search-bar.open {
            display: block;
        }

        .chat-search-bar input {
            width: 100%;
            border: 1.5px solid #000;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            outline: none;
            font-family: inherit;
        }

        .contacts-drawer {
            display: none;
            background: #f1f3f4;
            border-bottom: 2px solid #000;
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .contacts-drawer.open {
            display: block;
        }

        .contact-item {
            padding: 8px 12px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .contact-item.active {
            background: #ffd8df;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff6f8;
            overflow: hidden;
            min-height: 0;
            background-size: cover;
            background-position: center;
        }

        .chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .msg-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            max-width: 100%;
            padding: 6px 10px;
            border: 2px solid #000;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.2;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .msg-bubble.sent {
            background-color: #ffd8df;
            border-bottom-right-radius: 2px;
        }

        .msg-bubble.received {
            background-color: #fff;
            border-bottom-left-radius: 2px;
        }

        .msg-quote {
            background: rgba(0,0,0,0.06);
            border-left: 3px solid #b56565;
            padding: 3px 6px;
            margin-bottom: 4px;
            font-size: 9.5px;
            border-radius: 4px;
            color: #555;
        }

        .msg-quote strong {
            color: #8c4a4a;
        }

        .edited-tag {
            font-size: 8.5px;
            color: #888;
            font-style: italic;
            margin-left: 4px;
        }

        .read-status {
            font-size: 9px;
            color: #666;
            align-self: flex-end;
            margin-top: 3px;

    <script>
        // ==========================================
        // CONFIGURACIÓN DE FIREBASE - RATWEB
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB7Xpqlf5YdwHhrcpohoSJV0QDGBpMZIPk",
            authDomain: "ratweb-431ce.firebaseapp.com",
            databaseURL: "https://ratweb-431ce-default-rtdb.firebaseio.com",
            projectId: "ratweb-431ce",
            storageBucket: "ratweb-431ce.firebasestorage.app",
            messagingSenderId: "134049153537",
            appId: "1:134049153537:web:072dbc3c48b2337fc37600",
            measurementId: "G-JRBPSPTZQN"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        let currentUser = JSON.parse(localStorage.getItem('ratweb_user')) || null;
        let chatListeners = {};
        let chatId = '';
        let activeChatContact = 'RatBot';
        let posts = JSON.parse(localStorage.getItem('ratweb_posts')) || [];
        let forums = JSON.parse(localStorage.getItem('ratweb_forums')) || [];
        let gallery = JSON.parse(localStorage.getItem('ratweb_gallery')) || [];
        let usersPresence = JSON.parse(localStorage.getItem('ratweb_presence')) || {};
        let openRepliesBoxes = {};
        let chats = JSON.parse(localStorage.getItem('ratweb_chats')) || {};
        let activeReplyTargets = {};
        let tempAvatarData = null;
        let currentForumId = null;
        let editingMessageId = null;
        let chatSearchQuery = '';
        let mutedContacts = JSON.parse(localStorage.getItem('ratweb_muted_contacts')) || {};
        let chatWallpapers = JSON.parse(localStorage.getItem('ratweb_chat_wallpapers')) || {};
        let isTypingIndicatorOn = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let chatReplyTargets = {};

        const NAME_COOLDOWN_DAYS = 15;
        const USERNAME_COOLDOWN_DAYS = 30;
        const DAY_MS = 24 * 60 * 60 * 1000;
        const MAX_FORUMS_PER_USER = 3;
        const QUICK_REACTION_EMOJIS = ['👍','❤️','😂','😮','😢','🙏','🔥','🎉','😍','😭','😡','🤔','👏','🐾','🧀','✨','💯','😴','🥳','👀'];

        const BOT_REPLIES = [
            '¡Miau- digo, squeak! 🐭', 
            'Interesante, cuéntame más 🧀',
            '¡Jaja me encanta! 🐾',
            'Estoy pensando en queso ahora mismo 🧀',
            '¡Genial! Sigue así 💗'
        ];

        // ==========================================
        // FUNCIONES DE CHAT CON FIREBASE
        // ==========================================
        function getChatId(user1, user2) {
            const users = [user1, user2].sort();
            return users.join('_');
        }

        function switchChat(contact) {
            if (chatListeners[activeChatContact]) {
                chatListeners[activeChatContact]();
                delete chatListeners[activeChatContact];
            }
            
            activeChatContact = contact;
            chatId = getChatId(currentUser.username, contact);
            
            document.getElementById('chatWithUser').innerText = '@' + contact;
            clearChatReplyTarget();
            cancelEditMessage();
            document.getElementById('chatSearchInput').value = '';
            chatSearchQuery = '';
            document.getElementById('chatSearchBar').classList.remove('open');
            document.getElementById('searchToggleBtn').classList.remove('active-toggle');
            toggleContacts();
            updateMuteButtonUI();
            applyChatWallpaper();
            
            loadChatMessages(chatId);
        }

        function loadChatMessages(chatId) {
            const messagesRef = database.ref(`chats/${chatId}`);
            
            if (chatListeners[activeChatContact]) {
                chatListeners[activeChatContact]();
            }
            
            const listener = messagesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const messages = [];
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        messages.push({
                            id: parseInt(key),
                            ...data[key]
                        });
                    });
                    messages.sort((a, b) => a.timestamp - b.timestamp);
                }
                
                chats[activeChatContact] = messages;
                localStorage.setItem('ratweb_chats', JSON.stringify(chats));
                renderChat();
            });
            
            chatListeners[activeChatContact] = () => {
                messagesRef.off('value', listener);
            };
        }

        function sendChatMessageToFirebase(text, mediaSrc, mediaType, replyTo) {
            if (!currentUser) return;
            
            const chatId = getChatId(currentUser.username, activeChatContact);
            const messagesRef = database.ref(`chats/${chatId}`);
            
            const newMessageRef = messagesRef.push();
            const messageId = Date.now();
            
            const messageData = {
                id: messageId,
                sender: currentUser.username,
                text: text || '',
                mediaSrc: mediaSrc || null,
                mediaType: mediaType || null,
                replyTo: replyTo || null,
                reactions: {},
                edited: false,
                timestamp: Date.now()
            };
            
            newMessageRef.set(messageData).catch((error) => {
                console.error('Error al enviar mensaje:', error);
                saveMessageLocally(messageData);
            });
            
            document.getElementById('chatMsgInput').value = '';
            document.getElementById('chatMedia').value = '';
            clearChatReplyTarget();
        }

        function saveMessageLocally(messageData) {
            if (!chats[activeChatContact]) chats[activeChatContact] = [];
            chats[activeChatContact].push(messageData);
            localStorage.setItem('ratweb_chats', JSON.stringify(chats));
            renderChat();
        }

        function sendChatMessage() {
            const input = document.getElementById('chatMsgInput');
            const mediaInput = document.getElementById('chatMedia');
            const text = input.value.trim();
            const file = mediaInput ? mediaInput.files[0] : null;

            if (editingMessageId !== null) {
                saveEditMessage();
                return;
            }

            if (text === "" && !file) return;

            const replyTarget = chatReplyTargets[activeChatContact] || null;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    sendChatMessageToFirebase(
                        text, 
                        e.target.result, 
                        file.type.startsWith('video/') ? 'video' : 'image',
                        replyTarget
                    );
                    mediaInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                sendChatMessageToFirebase(text, null, null, replyTarget);
            }
        }

        function toggleReaction(msgId, emoji) {
            const chatId = getChatId(currentUser.username, activeChatContact);
            const messageRef = database.ref(`chats/${chatId}/${msgId}/reactions/${emoji}`);
            
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            
            messageRef.once('value').then((snapshot) => {
                const users = snapshot.val() || [];
                const idx = users.indexOf(myHandle);
                
                if (idx === -1) {
                    users.push(myHandle);
                } else {
                    users.splice(idx, 1);
                }
                
                if (users.length === 0) {
                    return messageRef.remove();
                } else {
                    return messageRef.set(users);
                }
            }).catch((error) => {
                console.error('Error al actualizar reacción:', error);
                const list = chats[activeChatContact] || [];
                const msg = list.find(m => m.id === msgId);
                if (msg) {
                    if (!msg.reactions) msg.reactions = {};
                    if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
                    const idx = msg.reactions[emoji].indexOf(myHandle);
                    if (idx === -1) msg.reactions[emoji].push(myHandle);
                    else msg.reactions[emoji].splice(idx, 1);
                    if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
                    localStorage.setItem('ratweb_chats', JSON.stringify(chats));
                    renderChat();
                }
            });
        }

        async function toggleVoiceRecording() {
            const micBtn = document.getElementById('micBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const replyTarget = chatReplyTargets[activeChatContact] || null;
                            sendChatMessageToFirebase('', e.target.result, 'audio', replyTarget);
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.innerText = '⏹️';
                } catch (err) {
                    alert('No se pudo acceder al micrófono. Revisa los permisos del navegador.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.innerText = '🎤';
            }
        }

        function renderChat() {
            const container = document.getElementById('chatMessages');
            if (!container) return;

            let list = chats[activeChatContact] || [];
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';

            if (chatSearchQuery) {
                list = list.filter(m => (m.text || '').toLowerCase().includes(chatSearchQuery));
            }

            if (list.length === 0) {
                container.innerHTML = `<p style="font-size:11px; text-align:center; color:#777; padding:12px;">🐭 ${chatSearchQuery ? 'No se encontraron mensajes.' : 'Comienza la conversación con ' + activeChatContact + ' 🧀'}</p>`;
                return;
            }

            container.innerHTML = list.map(msg => {
                const isSent = msg.sender === myHandle;
                const reactions = msg.reactions || {};
                const reactionEntries = Object.entries(reactions).filter(([_, users]) => users.length > 0);

                let mediaHtml = '';
                if (msg.mediaType === 'image') {
                    mediaHtml = `<img class="msg-media" src="${msg.mediaSrc}" onclick="openModal('${msg.mediaSrc}', 'image')">`;
                } else if (msg.mediaType === 'video') {
                    mediaHtml = `<video class="msg-media" src="${msg.mediaSrc}" controls></video>`;
                } else if (msg.mediaType === 'audio') {
                    mediaHtml = `<div class="voice-msg">🎤<audio src="${msg.mediaSrc}" controls></audio></div>`;
                }

                return `
                <div class="msg-row ${isSent ? 'sent' : 'received'}">
                    <div class="msg-bubble ${isSent ? 'sent' : 'received'}">
                        ${msg.replyTo ? `<div class="msg-quote"><strong>${msg.replyTo.sender}</strong>: ${msg.replyTo.text}</div>` : ''}
                        ${msg.text ? `<div>${msg.text}</div>` : ''}
                        ${mediaHtml}
                        ${reactionEntries.length > 0 ? `
                            <div class="msg-reactions">
                                ${reactionEntries.map(([emoji, users]) => `
                                    <span class="reaction-badge ${users.includes(myHandle) ? 'mine' : ''}" onclick="toggleReaction(${msg.id}, '${emoji}')">${emoji} ${users.length}</span>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                            <span class="edited-tag">${msg.edited ? '(editado)' : ''}</span>
                            ${isSent ? `<span class="read-status">Leído</span>` : ''}
                        </div>

                        ${isSent ? `
                        <div class="msg-options-wrapper" style="position:absolute; top:2px; right:4px;">
                            <span style="cursor:pointer; font-weight:bold; font-size:12px;" onclick="toggleMsgOptions(${msg.id})">⋮</span>
                            <div id="msg-options-${msg.id}" class="msg-options-menu">
                                ${msg.mediaType ? '' : `<button onclick="startEditMessage(${msg.id})">✏️ Editar</button>`}
                                <button onclick="deleteChatMessage(${msg.id})">🗑️ Borrar</button>
                            </div>
                        </div>
                        ` : ''}

                        <div class="reaction-picker" id="reaction-picker-${msg.id}">
                            <div class="reaction-picker-grid">
                                ${QUICK_REACTION_EMOJIS.map(e => `<span onclick="toggleReaction(${msg.id}, '${e}')">${e}</span>`).join('')}
                            </div>
                            <div class="reaction-picker-custom">
                                <input type="text" id="custom-emoji-${msg.id}" placeholder="Otro emoji 😊" maxlength="8" onkeypress="if(event.key==='Enter') addCustomReaction(${msg.id})">
                                <button onclick="addCustomReaction(${msg.id})">OK</button>
                            </div>
                        </div>
                    </div>
                    <div class="msg-actions-row">
                        <span class="msg-action-link" onclick="toggleReactionPicker(${msg.id})">Reaccionar</span>
                        <span class="msg-action-link" onclick="setChatReplyTarget(${msg.id})">Responder</span>
                    </div>
                </div>
                `;
            }).join('');

            if (isTypingIndicatorOn && !chatSearchQuery) {
                container.innerHTML += `<div class="typing-indicator">${activeChatContact} está escribiendo...</div>`;
            }

            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function registerUser() {
            const username = document.getElementById('regUsername').value.trim();
            const displayName = document.getElementById('regDisplayName').value.trim();
            const bio = document.getElementById('regBio').value.trim();

            if (!username || !displayName) {
                alert("Por favor ingresa un nombre de usuario y un nombre visible.");
                return;
            }

            const finalUsername = username.startsWith('@') ? username : '@' + username;

            auth.signInAnonymously()
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    const userData = {
                        username: finalUsername,
                        displayName: displayName,
                        bio: bio,
                        banner: null,
                        joinedAt: Date.now(),
                        lastNameChange: 0,
                        lastUsernameChange: 0,
                        avatar: tempAvatarData || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="50" fill="%23b56565"/></svg>'
                    };

                    return database.ref(`users/${user.uid}`).set(userData).then(() => {
                        currentUser = userData;
                        localStorage.setItem('ratweb_user', JSON.stringify(currentUser));
                        document.getElementById('headerAvatar').src = currentUser.avatar;
                        document.getElementById('authOverlay').style.display = 'none';
                        pingUserPresence();
                        renderPosts('main');
                        renderGallery();
                        renderForums();
                        updateContactsFromPosts();
                        
                        const initialChatId = getChatId(currentUser.username, 'RatBot');
                        loadChatMessages(initialChatId);
                    });
                })
                .catch((error) => {
                    console.error('Error al registrar usuario:', error);
                    alert('Error al registrarse. Intenta de nuevo.');
                });
        }

        function createPost(target) {
            const isForum = target === 'forum';
            const textInput = document.getElementById(isForum ? 'forumPostText' : 'postText');
            const fileInput = document.getElementById(isForum ? 'forumPostMedia' : 'postMedia');
            const userText = textInput.value.trim();

            if (userText === "" && fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePost(userText, e.target.result, file.type.startsWith('image/') ? 'image' : 'video', isForum ? currentForumId : null);
                    textInput.value = '';
                    fileInput.value = '';
                    updateContactsFromPosts();
                };
                reader.readAsDataURL(file);

                savePost(userText, null, null, isForum ? currentForumId : null);
                textInput.value = '';
                fileInput.value = '';
                updateContactsFromPosts();
            }
        }

        }

        function setReplyTarget(postId, authorHandle) {
            activeReplyTargets[postId] = authorHandle;
            const indicator = document.getElementById(`target-indicator-${postId}`);
            const textSpan = document.getElementById(`target-text-${postId}`);
            if (indicator && textSpan) {
                textSpan.innerText = `Respondiendo a ${authorHandle}`;
                indicator.classList.add('active');
            }
        }

        function clearReplyTarget(postId) {
            delete activeReplyTargets[postId];
            const indicator = document.getElementById(`target-indicator-${postId}`);
            if (indicator) indicator.classList.remove('active');
        }

        function addReply(postId, target) {
            const input = document.getElementById(`reply-input-${postId}`);
            const mediaInput = document.getElementById(`reply-media-${postId}`);
            const text = input.value.trim();
            const file = mediaInput ? mediaInput.files[0] : null;

            if (text === "" && !file) return;

            const post = posts.find(p => p.id === postId);
            if (!post) return;

            const replyTarget = activeReplyTargets[postId] || null;

            openRepliesBoxes[postId] = true;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    post.replies.push({
                        id: Date.now(),
                        authorName: currentUser ? currentUser.displayName : 'Wilhelm Reyes',
                        authorHandle: currentUser ? currentUser.username : '@ScottWilh',
                        replyTo: replyTarget,
                        text: text,
                        mediaSrc: e.target.result
                    });
                    localStorage.setItem('ratweb_posts', JSON.stringify(posts));
                    clearReplyTarget(postId);
                    if (mediaInput) mediaInput.value = '';
                    renderPosts(target);
                    updateContactsFromPosts();
                };
                reader.readAsDataURL(file);
            } else {
                post.replies.push({
                    id: Date.now(),
                    authorName: currentUser ? currentUser.displayName : 'Wilhelm Reyes',
                    authorHandle: currentUser ? currentUser.username : '@ScottWilh',
                    replyTo: replyTarget,
                    text: text,
                    mediaSrc: null
                });
                localStorage.setItem('ratweb_posts', JSON.stringify(posts));
                clearReplyTarget(postId);
                renderPosts(target);
                updateContactsFromPosts();
            }
        }

        function deleteComment(postId, commentId, target) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.replies = post.replies.filter(r => r.id !== commentId);
                localStorage.setItem('ratweb_posts', JSON.stringify(posts));
                openRepliesBoxes[postId] = true;
                renderPosts(target);
                updateContactsFromPosts();
            }
        }

        // ==========================================
        // FUNCIONES DE FOROS
        // ==========================================
        function getMyForumsCount() {
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            return forums.filter(f => f.creatorHandle === myHandle).length;
        }

        function updateForumCounter() {
            const counterEl = document.getElementById('forumCounter');
            const createBtn = document.getElementById('createForumBtn');
            const count = getMyForumsCount();
            const limitReached = count >= MAX_FORUMS_PER_USER;

            if (counterEl) {
                counterEl.innerText = `📋 Foros creados: ${count}/${MAX_FORUMS_PER_USER}${limitReached ? ' (límite alcanzado)' : ''}`;
                counterEl.classList.toggle('limit-reached', limitReached);
            }
            if (createBtn) {
                createBtn.disabled = limitReached;
            }
        }

        function createForum() {
            if (getMyForumsCount() >= MAX_FORUMS_PER_USER) {
                alert(`Solo puedes tener ${MAX_FORUMS_PER_USER} foros creados a la vez. Borra uno de los tuyos para crear otro.`);
                return;
            }

            const title = document.getElementById('forumTitle').value.trim();
            const category = document.getElementById('forumCategory').value.trim();
            const tags = document.getElementById('forumTags').value.trim();
            const desc = document.getElementById('forumDesc').value.trim();

            if (!title) return;

            const myHandle = currentUser ? currentUser.username : '@ScottWilh';

            const newForum = {
                id: Date.now(),
                title: title,
                category: category || 'GENERAL',
                tags: tags ? tags.split(',').map(t => t.trim()) : [],
                desc: desc,
                creatorHandle: myHandle,
                members: [myHandle]
            };

            forums.unshift(newForum);
            localStorage.setItem('ratweb_forums', JSON.stringify(forums));
            document.getElementById('forumTitle').value = '';
            document.getElementById('forumCategory').value = '';
            document.getElementById('forumTags').value = '';
            document.getElementById('forumDesc').value = '';
            renderForums();
        }

        function deleteForum(forumId, event) {
            event.stopPropagation();
            if (confirm("¿Seguro que quieres borrar este foro?")) {
                forums = forums.filter(f => f.id !== forumId);
                posts = posts.filter(p => p.forumId !== forumId);
                localStorage.setItem('ratweb_forums', JSON.stringify(forums));
                localStorage.setItem('ratweb_posts', JSON.stringify(posts));
                renderForums();
                if (currentForumId === forumId) showSection('foros');
                updateContactsFromPosts();
            }
        }

        function toggleJoinForum(forumId, event) {
            event.stopPropagation();
            const forum = forums.find(f => f.id === forumId);
            if (!forum) return;

            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            const index = forum.members.indexOf(myHandle);

            if (index === -1) forum.members.push(myHandle);
            else forum.members.splice(index, 1);

            localStorage.setItem('ratweb_forums', JSON.stringify(forums));
            renderForums();
            if (currentForumId === forumId) openForum(forumId);
        }

        function getActiveForumMembersCount(forumMembers) {
            const now = Date.now();
            let activeCount = 0;
            if (!forumMembers) return 0;
            
            for (let memberHandle of forumMembers) {
                if (usersPresence[memberHandle] && (now - usersPresence[memberHandle] < 60000)) {
                    activeCount++;
                }
            }
            return activeCount;
        }

        function renderForums(filteredList) {
            const container = document.getElementById('forumsList');
            updateForumCounter();
            if (!container) return;

            const sourceForums = filteredList || forums;
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';

            if (sourceForums.length === 0) {
                container.innerHTML = `<p style="font-size:11px; text-align:center; color:#777; padding:12px;">🐭 No se encontraron foros con esa etiqueta.</p>`;
                return;
            }

            container.innerHTML = sourceForums.map(f => {
                const isJoined = f.members.includes(myHandle);
                const isCreator = f.creatorHandle === myHandle;
                const activeCount = getActiveForumMembersCount(f.members);

                return `
                <div class="forum-card" onclick="openForum(${f.id})">
                    <div class="forum-header-container">
                        <div>
                            <div class="forum-category">${f.category}</div>
                            <div class="forum-title">${f.title}</div>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <button class="btn-join-forum ${isJoined ? 'joined' : ''}" onclick="toggleJoinForum(${f.id}, event)">
                                ${isJoined ? 'Unido' : 'Unirme'}
                            </button>
                            ${isCreator ? `
                                <button class="btn-delete-forum" onclick="deleteForum(${f.id}, event)">🗑️ Borrar</button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="forum-desc">${f.desc}</div>
                    <div class="forum-tags-container">
                        ${f.tags.map(t => `<span class="forum-tag-badge">#${t}</span>`).join('')}
                    </div>
                    <div class="forum-stats-box">
                        <span>👥 ${f.members.length} Miembro${f.members.length === 1 ? '' : 's'}</span>
                        <span>🟢 ${activeCount} Activo${activeCount === 1 ? '' : 's'}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openForum(forumId) {
            currentForumId = forumId;
            const forum = forums.find(f => f.id === forumId);
            if (!forum) return;

            const header = document.getElementById('forumHeader');
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            const isJoined = forum.members.includes(myHandle);
            const isCreator = forum.creatorHandle === myHandle;
            const activeCount = getActiveForumMembersCount(forum.members);

            header.innerHTML = `
                <div class="forum-header-container">
                    <div>
                        <div class="forum-category">${forum.category}</div>
                        <div class="forum-title">${forum.title}</div>
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <button class="btn-join-forum ${isJoined ? 'joined' : ''}" onclick="toggleJoinForum(${forum.id}, event)">
                            ${isJoined ? 'Unido' : 'Unirme'}
                        </button>
                        ${isCreator ? `
                            <button class="btn-delete-forum" onclick="deleteForum(${forum.id}, event)">🗑️ Borrar</button>
                        ` : ''}
                    </div>
                </div>
                <div class="forum-desc">${forum.desc}</div>
                <div class="forum-tags-container">
                    ${forum.tags.map(t => `<span class="forum-tag-badge">#${t}</span>`).join('')}
                </div>
                <div class="forum-stats-box">
                    <span>👥 ${forum.members.length} Miembro${forum.members.length === 1 ? '' : 's'}</span>
                    <span>🟢 ${activeCount} Activo${activeCount === 1 ? '' : 's'}</span>
                </div>
            `;

            showSection('forumView');
            renderPosts('forum');
        }

        // ==========================================
        // FUNCIONES DE GALERÍA
        // ==========================================
        function uploadToGallery() {
            const title = document.getElementById('galleryTitle').value.trim();
            const category = document.getElementById('galleryCategory').value;
            const fileInput = document.getElementById('galleryFile');
            const visibilityInput = document.querySelector('input[name="galleryVisibility"]:checked');
            const visibility = visibilityInput ? visibilityInput.value : 'public';

            if (!fileInput.files[0]) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                gallery.unshift({
                    id: Date.now(),
                    title: title || 'Sin título',
                    category: category,
                    src: e.target.result,
                    uploaderHandle: currentUser ? currentUser.username : '@ScottWilh',
                    visibility: visibility,
                    likedBy: []
                });
                localStorage.setItem('ratweb_gallery', JSON.stringify(gallery));
                document.getElementById('galleryTitle').value = '';
                fileInput.value = '';
                renderGallery();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function getVisibleGalleryItems() {
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            return gallery.filter(item => item.visibility !== 'private' || item.uploaderHandle === myHandle);
        }

        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            if (!container) return;

            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            const visibleItems = getVisibleGalleryItems();

            if (visibleItems.length === 0) {
                container.innerHTML = `<p style="font-size:11px; text-align:center; color:#777; padding:12px; grid-column:1/-1;">🐭 No hay imágenes en la galería. ¡Sube tu primera obra!</p>`;
                return;
            }

            container.innerHTML = visibleItems.map(item => {
                const isMine = item.uploaderHandle === myHandle;
                const likedBy = item.likedBy || [];
                const isLiked = likedBy.includes(myHandle);
                const isPrivate = item.visibility === 'private';

                return `
                <div class="polaroid-card">
                    ${isMine ? `<button class="polaroid-delete-btn" onclick="deleteGalleryItem(${item.id}, event)">🗑️</button>` : ''}
                    <img class="polaroid-img" src="${item.src}" onclick="openModal('${item.src}', 'image')">
                    <div class="polaroid-caption">${item.title}</div>
                    <span class="polaroid-tag">${item.category}</span>
                    <span class="polaroid-tag" style="background:${isPrivate ? '#dbe2e6' : '#e2f0d9'};">${isPrivate ? '🔒 Privada' : '🌍 Pública'}</span>
                    <span class="polaroid-like-btn ${isLiked ? 'liked' : ''}" onclick="toggleGalleryLike(${item.id}, event)">
                        🐾 ${likedBy.length}
                    </span>
                </div>
                `;
            }).join('');
        }

        function deleteGalleryItem(id, event) {
            event.stopPropagation();
            const item = gallery.find(g => g.id === id);
            if (!item) return;

            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            if (item.uploaderHandle !== myHandle) return;

            if (confirm('¿Eliminar esta imagen de la galería?')) {
                gallery = gallery.filter(g => g.id !== id);
                localStorage.setItem('ratweb_gallery', JSON.stringify(gallery));
                renderGallery();
            }
        }

        function toggleGalleryLike(id, event) {
            event.stopPropagation();
            const item = gallery.find(g => g.id === id);
            if (!item) return;

            if (!item.likedBy) item.likedBy = [];
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            const idx = item.likedBy.indexOf(myHandle);

            if (idx === -1) item.likedBy.push(myHandle);
            else item.likedBy.splice(idx, 1);

            localStorage.setItem('ratweb_gallery', JSON.stringify(gallery));
            renderGallery();
        }

        // ==========================================
        // FUNCIONES DE PERFIL
        // ==========================================
        function renderProfile() {
            if (!currentUser) return;

            const banner = document.getElementById('profileBanner');
            banner.style.backgroundImage = currentUser.banner ? `url('${currentUser.banner}')` : 'none';

            document.getElementById('profileAvatarImg').src = currentUser.avatar || '';
            document.getElementById('profileDisplayName').innerText = currentUser.displayName;
            document.getElementById('profileUsername').innerText = currentUser.username;
            document.getElementById('profileBioInput').value = currentUser.bio || '';

            updateNameCooldownUI();
            updateUsernameCooldownUI();

            const myHandle = currentUser.username;
            document.getElementById('statPosts').innerText = posts.filter(p => p.authorHandle === myHandle).length;
            document.getElementById('statGallery').innerText = gallery.filter(g => g.uploaderHandle === myHandle).length;
            document.getElementById('statForums').innerText = forums.filter(f => f.members.includes(myHandle)).length;

            const myPostsLikes = posts.filter(p => p.authorHandle === myHandle).reduce((sum, p) => sum + p.likedBy.length, 0);
            const myGalleryLikes = gallery.filter(g => g.uploaderHandle === myHandle).reduce((sum, g) => sum + (g.likedBy ? g.likedBy.length : 0), 0);
            document.getElementById('statCheese').innerText = myPostsLikes + myGalleryLikes;

            const joinedDate = new Date(currentUser.joinedAt);
            document.getElementById('profileJoinedNote').innerText = `🐭 Miembro desde ${joinedDate.toLocaleDateString('es-ES', { year: 'numeric', month: 'long' })}`;
        }

        function changeBanner(event) {
            const file = event.target.files[0];
            if (!file || !currentUser) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.banner = e.target.result;
                localStorage.setItem('ratweb_user', JSON.stringify(currentUser));
                renderProfile();
            };
            reader.readAsDataURL(file);
        }

        function changeProfileAvatar(event) {
            const file = event.target.files[0];
            if (!file || !currentUser) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.avatar = e.target.result;
                localStorage.setItem('ratweb_user', JSON.stringify(currentUser));
                document.getElementById('headerAvatar').src = currentUser.avatar;
                renderProfile();
            };
            reader.readAsDataURL(file);
        }

        function getDaysRemaining(lastChangeTs, cooldownDays) {
            const elapsed = Date.now() - lastChangeTs;
            const remainingMs = (cooldownDays * DAY_MS) - elapsed;
            return Math.ceil(remainingMs / DAY_MS);
        }

        function updateNameCooldownUI() {
            const pencil = document.getElementById('editNamePencil');
            const note = document.getElementById('nameCooldownNote');
            const daysLeft = getDaysRemaining(currentUser.lastNameChange, NAME_COOLDOWN_DAYS);
            if (daysLeft > 0) {
                pencil.style.opacity = '0.3';
                pencil.style.pointerEvents = 'none';
                note.innerText = `Podrás cambiar tu nombre en ${daysLeft} día${daysLeft === 1 ? '' : 's'}`;
            } else {
                pencil.style.opacity = '1';
                pencil.style.pointerEvents = 'auto';
                note.innerText = '';
            }
        }

        function updateUsernameCooldownUI() {
            const pencil = document.getElementById('editUsernamePencil');
            const note = document.getElementById('usernameCooldownNote');
            const daysLeft = getDaysRemaining(currentUser.lastUsernameChange, USERNAME_COOLDOWN_DAYS);
            if (daysLeft > 0) {
                pencil.style.opacity = '0.3';
                pencil.style.pointerEvents = 'none';
                note.innerText = `Podrás cambiar tu @usuario en ${daysLeft} día${daysLeft === 1 ? '' : 's'}`;
            } else {
                pencil.style.opacity = '1';
                pencil.style.pointerEvents = 'auto';
                note.innerText = '';
            }
        }

        function startEditName() {
            const daysLeft = getDaysRemaining(currentUser.lastNameChange, NAME_COOLDOWN_DAYS);
            if (daysLeft > 0) return;
            document.getElementById('editNameInput').value = currentUser.displayName;
            document.getElementById('editNameBox').style.display = 'flex';
        }

        function cancelEditName() {
            document.getElementById('editNameBox').style.display = 'none';
        }

        function saveName() {
            const newName = document.getElementById('editNameInput').value.trim();
            if (!newName) return;
            currentUser.displayName = newName;
            currentUser.lastNameChange = Date.now();
            localStorage.setItem('ratweb_user', JSON.stringify(currentUser));
            cancelEditName();
            renderProfile();
        }

        function startEditUsername() {
            const daysLeft = getDaysRemaining(currentUser.lastUsernameChange, USERNAME_COOLDOWN_DAYS);
            if (daysLeft > 0) return;
            document.getElementById('editUsernameInput').value = currentUser.username.replace('@', '');
            document.getElementById('editUsernameBox').style.display = 'flex';
        }

        function cancelEditUsername() {
            document.getElementById('editUsernameBox').style.display = 'none';
        }

        function saveUsername() {
            let newUsername = document.getElementById('editUsernameInput').value.trim();
            if (!newUsername) return;
            if (!newUsername.startsWith('@')) newUsername = '@' + newUsername;
            currentUser.username = newUsername;
            currentUser.lastUsernameChange = Date.now();
            localStorage.setItem('ratweb_user', JSON.stringify(currentUser));
            cancelEditUsername();
            renderProfile();
        }

        function saveBio() {
            if (!currentUser) return;
            currentUser.bio = document.getElementById('profileBioInput').value.trim();
            localStorage.setItem('ratweb_user', JSON.stringify(currentUser));
        }

        // ==========================================
        // FUNCIONES DE PRESENCIA Y NAVEGACIÓN
        // ==========================================
        function pingUserPresence() {
            if (!currentUser) return;
            usersPresence[currentUser.username] = Date.now();
            localStorage.setItem('ratweb_presence', JSON.stringify(usersPresence));
            if (document.getElementById('foros').classList.contains('active')) {
                renderForums();
            }
        }

        setInterval(pingUserPresence, 10000);

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            const targetSec = document.getElementById(sectionId);
            if (targetSec) targetSec.classList.add('active');

            const navBtn = document.getElementById(`btn-${sectionId}`);
            if (navBtn) navBtn.classList.add('active');
            else if (sectionId === 'forumView') {
                document.getElementById('btn-foros').classList.add('active');
            }

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.placeholder = sectionId === 'foros' ? 'Buscar por #tag...' : 'Buscar...';
                searchInput.value = '';
            }

            if (sectionId === 'perfil') renderProfile();

            handleSearch();
        }

        function updateContactsFromPosts() {
            const myHandle = currentUser ? currentUser.username : '@ScottWilh';
            const contactsSet = new Set(['RatBot']);
            
            posts.forEach(post => {
                if (post.authorHandle && post.authorHandle !== myHandle) {
                    contactsSet.add(post.authorHandle);
                }
                if (post.replies) {
                    post.replies.forEach(reply => {
                        if (reply.authorHandle && reply.authorHandle !== myHandle) {
                            contactsSet.add(reply.authorHandle);
                        }
                    });
                }
            });
            
            const drawer = document.getElementById('contactsDrawer');
            if (!drawer) return;
            
            const currentContact = activeChatContact;
            drawer.innerHTML = Array.from(contactsSet).map(handle => `
                <div class="contact-item ${handle === currentContact ? 'active' : ''}" onclick="switchChat('${handle}')">
                    <span class="active-dot"></span> ${handle}
                </div>
            `).join('');
        }

        // ==========================================
        // FUNCIONES DE MODAL Y BÚSQUEDA
        // ==========================================
        function openModal(src, type) {
            const modal = document.getElementById('imageModal');
            const content = document.getElementById('modalContent');
            if (!modal || !content) return;

            if (type === 'image') {
                content.innerHTML = `<img src="${src}">`;
            } else {
                content.innerHTML = `<video src="${src}" controls autoplay></video>`;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            if (modal) modal.style.display = 'none';
        }

        function handleSearch() {
            const rawQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const query = rawQuery.startsWith('#') ? rawQuery.slice(1) : rawQuery;

            const isForosActive = document.getElementById('foros').classList.contains('active');
            const isMenuActive = document.getElementById('menu').classList.contains('active');

            if (!query) {
                renderPosts('main');
                renderForums();
                return;
            }

            if (isForosActive) {
                const filtered = forums.filter(f =>
                    f.tags.some(t => t.toLowerCase().includes(query)) ||
                    f.title.toLowerCase().includes(query) ||
                    f.category.toLowerCase().includes(query)
                );
                renderForums(filtered);
                return;
            }

            if (isMenuActive) {
                const mainList = document.getElementById('feedList');
                if (!mainList) return;
                const filtered = posts.filter(p =>
                    p.text.toLowerCase().includes(query) ||
                    p.authorName.toLowerCase().includes(query) ||
                    p.authorHandle.toLowerCase().includes(query)
                );
                if (filtered.length === 0) {
                    mainList.innerHTML = `<p style="font-size:11px; text-align:center; color:#777; padding:12px;">🐭 No se encontraron publicaciones.</p>`;
                    return;
                }
                const myHandle = currentUser ? currentUser.username : '@ScottWilh';
                mainList.innerHTML = filtered.map(p => `
                    <div class="post-card">
                        <img class="avatar-circle" src="${p.avatar || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23ccc\'/></svg>'}">
                        <div class="post-bubble">
                            <div class="post-header">
                                <span class="post-author">${p.authorName} (${p.authorHandle})</span>
                            </div>
                            <div class="post-content">${p.text}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        window.onload = function() {
            if (currentUser) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('headerAvatar').src = currentUser.avatar || '';
                pingUserPresence();
                
                auth.signInAnonymously().catch((error) => {
                    console.error('Error en autenticación anónima:', error);
                });
                
                const initialChatId = getChatId(currentUser.username, 'RatBot');
                loadChatMessages(initialChatId);
            }
            renderPosts('main');
            renderForums();
            renderGallery();
            updateMuteButtonUI();
            applyChatWallpaper();
            updateContactsFromPosts();
        };

        console.log('🔥 RatWeb con Firebase iniciado correctamente');
        console.log('📱 App ID:', firebaseConfig.appId);
        console.log('👤 Usuario actual:', currentUser ? currentUser.username : 'No autenticado');
    </script>
</body>
